    <script>
        //
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxLRohgJOLdKADjTIj_BVPrKtZb2LuQCK_qOQjkqfJFSmvEWgjKIqyFkphxbkAopSWyVw/exec';
        const STUDENT_NAME_STORAGE_KEY = 'dsskyStudentName_v1';
        const PASSWORD_STORAGE_PREFIX = 'dsskyPassword_v1:';

        let db = {};
        let selectedCategory = "";
        let selectedGrade = "";
        let selectedSubject = "";
        let selectedProblem = "";
        let selectedPassword = "";
        let selectedLearningMode = "quiz";
        let step3BackTarget = "step2";

        const gradeGroups = [
            { name: "중등", grades: ["중1", "중2", "중3"] },
            { name: "고등", grades: ["고1", "고2", "고3"] },
            { name: "TOEFL", grades: ["TOEFL"] },
            { name: "SAT", grades: ["SAT"] }
        ];

        window.onload = function() {
            document.getElementById('student-name').value = getSavedStudentName();
            const categoryDiv = document.getElementById('category-btns');
            loadCategoryData(categoryDiv);
        }

        function getSavedStudentName() {
            try {
                return String(localStorage.getItem(STUDENT_NAME_STORAGE_KEY) || '').trim();
            } catch (error) {
                return '';
            }
        }

        function saveStudentName(name) {
            try {
                localStorage.setItem(STUDENT_NAME_STORAGE_KEY, String(name || '').trim());
            } catch (error) {
                // The test still works when private browsing blocks local storage.
            }
        }

        function getPasswordStorageKey() {
            return `${PASSWORD_STORAGE_PREFIX}${encodeURIComponent(`${selectedGrade}:${selectedSubject}`)}`;
        }

        function getSavedPassword() {
            try {
                return String(localStorage.getItem(getPasswordStorageKey()) || '');
            } catch (error) {
                return '';
            }
        }

        function savePassword(password) {
            try {
                localStorage.setItem(getPasswordStorageKey(), String(password || ''));
            } catch (error) {
                // The test still works when private browsing blocks local storage.
            }
        }

        function loadCategoryData(categoryDiv) {
            fetchJsonWithRetry(`${scriptURL}?t=${Date.now()}`, 3, 20000, (nextAttempt, maxAttempts) => {
                categoryDiv.innerHTML = `<p style="grid-column: span 2;">연결이 불안정해 데이터를 다시 불러오는 중입니다... (${nextAttempt}/${maxAttempts})</p>`;
            })
            .then(data => {
                if (!Array.isArray(data)) {
                    throw new Error("Invalid data");
                }
                categoryDiv.innerHTML = "";
                db = {};
                const fallbackPasswords = {};

                data.forEach(item => {
                    const key = `${item.grade}-${item.subject}-${item.set}`;
                    const password = String(item.password || '').trim();
                    if (password && !fallbackPasswords[key]) fallbackPasswords[key] = password;
                });

                data.forEach(item => {
                    if (!db[item.grade]) db[item.grade] = {};
                    if (!db[item.grade][item.subject]) db[item.grade][item.subject] = [];
                    const key = `${item.grade}-${item.subject}-${item.set}`;
                    db[item.grade][item.subject].push({
                        set: String(item.set || '').trim(),
                        password: String(item.password || '').trim() || fallbackPasswords[key] || '',
                        learningType: normalizeLearningType(item.learningType)
                    });
                });

                renderCategoryButtons();
            })
            .catch(() => {
                categoryDiv.innerHTML = `<p style="grid-column: span 2; color: red; margin-bottom: 8px;">데이터를 불러오지 못했습니다.</p><button class="full-width" onclick="loadCategoryData(document.getElementById('category-btns'))">다시 불러오기</button>`;
            });
        }

        function fetchJsonWithRetry(url, maxAttempts, timeoutMs, onRetry) {
            let attempt = 0;

            function request() {
                attempt++;
                const controller = typeof AbortController === "function" ? new AbortController() : null;
                const timeoutId = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;
                const options = { cache: "no-store" };
                if (controller) options.signal = controller.signal;

                return fetch(url, options)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.json();
                })
                .finally(() => {
                    if (timeoutId) clearTimeout(timeoutId);
                })
                .catch(error => {
                    if (attempt >= maxAttempts) throw error;
                    if (onRetry) onRetry(attempt + 1, maxAttempts);
                    return new Promise(resolve => setTimeout(resolve, attempt * 900)).then(request);
                });
            }

            return request();
        }

        function renderCategoryButtons() {
            const categoryDiv = document.getElementById('category-btns');
            categoryDiv.innerHTML = "";

            let hasData = false;
            gradeGroups.forEach(group => {
                const availableGrades = group.grades.filter(grade => db[grade]);
                if (availableGrades.length > 0) {
                    hasData = true;
                    categoryDiv.innerHTML += `<button class="${getCategoryButtonClass(group.name)}" onclick="selectCategory('${group.name}')">${group.name}</button>`;
                }
            });

            const groupedGrades = gradeGroups.flatMap(group => group.grades);
            const extraGrades = Object.keys(db).filter(grade => !groupedGrades.includes(grade));
            if (extraGrades.length > 0) {
                hasData = true;
                categoryDiv.innerHTML += `<button onclick="selectCategory('기타')">기타</button>`;
            }

            if(!hasData) {
                categoryDiv.innerHTML = "<p style='grid-column: span 2;'>아직 등록된 문제가 없습니다.</p>";
            }
        }

        function getCategoryButtonClass(category) {
            if (category === '중등') return 'category-middle-btn';
            if (category === '고등') return 'category-high-btn';
            if (category === 'TOEFL') return 'category-toefl-btn';
            return '';
        }

        function selectCategory(category) {
            selectedCategory = category;
            const directGroup = gradeGroups.find(item => item.name === category && item.grades.length === 1);
            if (directGroup) {
                selectGrade(directGroup.grades[0], 'step1');
                return;
            }

            document.getElementById('category-title').innerText = "선택한 분류: " + category;
            const gradeDiv = document.getElementById('grade-btns');
            gradeDiv.innerHTML = "";

            const group = gradeGroups.find(item => item.name === category);
            const grades = group
                ? group.grades.filter(grade => db[grade])
                : Object.keys(db).filter(grade => !gradeGroups.flatMap(item => item.grades).includes(grade));

            grades.forEach(grade => {
                gradeDiv.innerHTML += `<button onclick="selectGrade('${grade}')">${grade}</button>`;
            });

            changeScreen('step1', 'step2');
        }

        function selectGrade(grade, fromStep = 'step2') {
            selectedGrade = grade;
            step3BackTarget = fromStep;
            document.getElementById('grade-title').innerText = "선택한 학년/시험: " + grade;
            const subjectDiv = document.getElementById('subject-btns');
            subjectDiv.innerHTML = ""; 
            for (let subject in db[grade]) {
                let subjectClass = "";
                if (grade === "TOEFL" && /(라이팅|writing)/i.test(subject)) {
                    subjectClass = "toefl-writing-btn";
                }
                if (grade === "TOEFL" && subject === "작문연습") {
                    subjectClass = "toefl-writing-practice-btn";
                }
                subjectDiv.innerHTML += `<button class="${subjectClass}" onclick="selectSubject('${subject}')">${subject}</button>`;
            }
            changeScreen(fromStep, 'step3');
        }

        function selectSubject(subject) {
            selectedSubject = subject;
            document.getElementById('subject-title').innerText = "선택한 과목: " + subject;
            const problemDiv = document.getElementById('problem-btns');
            problemDiv.innerHTML = ""; 
            
            let problems = db[selectedGrade][subject];
            for (let i = 0; i < problems.length; i++) {
                const problem = problems[i];
                if (!isSchoolExamGrade(selectedGrade)) {
                    appendProblemButton(problemDiv, i, problem, 'quiz');
                } else if (problem.learningType === '둘다') {
                    appendProblemButton(problemDiv, i, problem, 'quiz');
                    appendProblemButton(problemDiv, i, problem, 'memorize');
                } else {
                    appendProblemButton(problemDiv, i, problem, problem.learningType === '빈칸' ? 'memorize' : 'quiz');
                }
            }
            changeScreen('step3', 'step4');
        }

        function appendProblemButton(container, index, problem, mode) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = mode === 'memorize' ? 'problem-memorize-btn' : 'problem-quiz-btn';
            button.innerText = getProblemDisplayName(problem.set, mode);
            button.onclick = () => selectProblemByIndex(index, mode);
            container.appendChild(button);
        }

        function selectProblemByIndex(index, mode) {
            const problem = db[selectedGrade][selectedSubject][index];
            selectedProblem = problem.set;
            selectedPassword = problem.password;
            selectedLearningMode = mode || 'quiz';
            showPasswordScreen('step4');
        }

        function isSchoolExamGrade(grade) {
            return ["중1", "중2", "중3", "고1", "고2", "고3"].includes(grade);
        }

        function normalizeLearningType(value) {
            const normalized = String(value || '').trim().toLowerCase();
            if (normalized === '빈칸' || normalized === '암기' || normalized === 'memorize') return '빈칸';
            if (normalized === '둘다' || normalized === 'both') return '둘다';
            return '문제';
        }

        function getProblemDisplayName(problem, mode) {
            if (!isSchoolExamGrade(selectedGrade)) return problem;
            const suffix = mode === 'memorize' ? '빈칸 채우기' : '문제 풀기';
            return problem.includes(suffix) ? problem : `${problem} ${suffix}`;
        }

        function showPasswordScreen(fromStep) {
            const learningName = getProblemDisplayName(selectedProblem, selectedLearningMode);
            document.getElementById('problem-title').innerText = "선택한 학습: " + learningName;
            document.getElementById('start-learning-btn').innerText = selectedLearningMode === 'memorize'
                ? "빈칸 채우기 시작"
                : "문제 풀기 시작";
            document.getElementById('password-input').value = getSavedPassword();
            changeScreen(fromStep, 'step5');
        }

        function changeScreen(hideId, showId) {
            document.getElementById(hideId).classList.add('hidden');
            document.getElementById(showId).classList.remove('hidden');
        }
        
        function goBack(hideId, showId) {
            changeScreen(hideId, showId);
            document.getElementById('password-input').value = ""; 
        }

        function goBackFromStep3() {
            goBack('step3', step3BackTarget || 'step2');
        }

        function goBackFromPassword() {
            goBack('step5', 'step4');
        }

        function checkPassword() {
            const studentName = document.getElementById('student-name').value.trim();
            const pwd = document.getElementById('password-input').value;
            const realPassword = selectedPassword;

            if(!studentName) {
                alert("학생 이름을 입력해 주세요!");
                document.getElementById('student-name').focus();
                return;
            }

            if(pwd === realPassword) {
                saveStudentName(studentName);
                savePassword(pwd);
                const params = new URLSearchParams({
                    problem: selectedProblem,
                    student: studentName,
                    grade: selectedGrade,
                    subject: selectedSubject
                });
                sessionStorage.setItem('dsskyQuizAccess', JSON.stringify({
                    problem: selectedProblem,
                    student: studentName,
                    grade: selectedGrade,
                    subject: selectedSubject,
                    learningMode: selectedLearningMode,
                    createdAt: Date.now()
                }));
                window.location.href = (selectedLearningMode === 'memorize' ? "memorize.html?" : "quiz.html?") + params.toString();
            } else {
                alert("암호가 틀렸습니다. 다시 확인해 주세요!");
            }
        }

        function showPublicResults(kind) {
            changeScreen('step1', 'public-results-screen');
            const area = document.getElementById('public-results-area');
            const title = document.getElementById('public-results-title');
            const desc = document.getElementById('public-results-desc');
            const isScore = kind === 'score';
            const action = isScore ? 'getPublicScoreResults' : 'getPublicTestResults';
            const expectedType = isScore ? 'publicScoreResults' : 'publicTestResults';

            title.innerText = isScore ? '결과-단어' : '결과-Test';
            desc.innerText = isScore ? '최근 단어 테스트 결과입니다.' : '최근 내신 / 모의고사 풀이 결과입니다.';
            area.className = 'result-loading';
            area.innerHTML = '결과를 불러오는 중입니다...';

            fetch(`${scriptURL}?action=${action}&limit=100&t=${Date.now()}`, { cache: "no-store" })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (!data || data.type !== expectedType || !Array.isArray(data.rows)) {
                    throw new Error("Invalid data");
                }

                const rows = data.rows;

                if (rows.length === 0) {
                    area.className = 'result-loading';
                    area.innerHTML = '아직 표시할 결과가 없습니다.';
                    return;
                }

                area.className = 'results-table-wrap';
                area.innerHTML = isScore ? renderScoreResultsTable(rows) : renderTestResultsTable(rows);
            })
            .catch(error => {
                area.className = 'result-loading';
                area.innerHTML = "결과를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
            });
        }

        function renderScoreResultsTable(rows) {
            return `
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>이름</th>
                            <th>단어</th>
                            <th>범위</th>
                            <th>결과</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows.map(item => `
                            <tr>
                                <td>${escapeHtml(item.date)}</td>
                                <td>${escapeHtml(item.studentName)}</td>
                                <td>${escapeHtml(item.subjectDay)}</td>
                                <td>${escapeHtml(item.range)}</td>
                                <td>${escapeHtml(item.score)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderTestResultsTable(rows) {
            return `
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>날짜</th>
                                <th>이름</th>
                                <th>학년</th>
                                <th>과목</th>
                                <th>문제</th>
                                <th>결과</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows.map(item => `
                                <tr>
                                    <td>${escapeHtml(item.date)}</td>
                                    <td>${escapeHtml(item.studentName)}</td>
                                    <td>${escapeHtml(item.grade)}</td>
                                    <td>${escapeHtml(item.subject)}</td>
                                    <td>${escapeHtml(item.problemSet)}</td>
                                    <td>${escapeHtml(item.score)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
        }

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
