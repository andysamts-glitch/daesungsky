<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>작문 결과 찾기</title>
    <style>
        body { margin: 0; padding: 24px; background: #f4f6f9; color: #2d3748; font-family: 'Malgun Gothic', sans-serif; }
        .page { width: min(520px, 100%); margin: 0 auto; }
        .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
        h1 { margin: 0; color: #1a365d; font-size: 24px; line-height: 1.3; }
        .subtitle { margin: 5px 0 0; color: #718096; font-size: 14px; line-height: 1.5; }
        .home-btn { flex: 0 0 auto; padding: 8px 12px; border: 0; border-radius: 8px; background: #ed8936; color: #fff; font: inherit; font-size: 13px; font-weight: bold; cursor: pointer; }
        .home-btn:hover { background: #dd6b20; }
        .find-form { padding: 24px; border-radius: 8px; background: #fff; box-shadow: 0 3px 9px rgba(0, 0, 0, 0.08); }
        label { display: block; margin: 0 0 7px; color: #4a5568; font-size: 14px; font-weight: bold; }
        input, select { width: 100%; margin: 0 0 16px; padding: 13px; box-sizing: border-box; border: 2px solid #cbd5e0; border-radius: 8px; background: #fff; color: #2d3748; font: inherit; font-size: 16px; }
        input:focus, select:focus { outline: none; border-color: #c04f78; }
        .find-btn { width: 100%; padding: 14px; border: 0; border-radius: 8px; background: #c04f78; color: #fff; font: inherit; font-size: 16px; font-weight: bold; cursor: pointer; }
        .find-btn:hover { background: #a73d62; }
        .find-btn:disabled { background: #a0aec0; cursor: default; }
        .status { min-height: 22px; margin: 14px 0 0; color: #c53030; font-size: 14px; font-weight: bold; text-align: center; line-height: 1.5; }
        @media (max-width: 640px) {
            body { padding: 14px; }
            h1 { font-size: 20px; }
            .find-form { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="page-header">
            <div>
                <h1>작문 결과 찾기</h1>
                <p class="subtitle">가장 최근에 제출한 작문 결과를 엽니다.</p>
            </div>
            <button class="home-btn" onclick="location.href='index.html'">홈으로</button>
        </header>

        <form id="find-form" class="find-form">
            <label for="student-name">학생 이름</label>
            <input id="student-name" type="text" autocomplete="name" placeholder="이름을 입력하세요" required>

            <label for="problem-set">작문 문제</label>
            <select id="problem-set" required disabled>
                <option>작문 문제를 불러오는 중입니다...</option>
            </select>

            <label for="password">문제 암호</label>
            <input id="password" type="password" inputmode="numeric" maxlength="4" placeholder="4자리 암호" required>

            <button id="find-btn" class="find-btn" type="submit" disabled>결과 찾기</button>
            <p id="status" class="status"></p>
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxLRohgJOLdKADjTIj_BVPrKtZb2LuQCK_qOQjkqfJFSmvEWgjKIqyFkphxbkAopSWyVw/exec';

        window.onload = loadWritingSets;
        document.getElementById('find-form').addEventListener('submit', findResult);

        function loadWritingSets() {
            const problemSet = document.getElementById('problem-set');
            const findButton = document.getElementById('find-btn');
            const status = document.getElementById('status');

            fetch(`${scriptURL}?action=getWritingResultSets&t=${Date.now()}`, { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    const sets = Array.isArray(data && data.sets) ? data.sets : [];
                    if (!sets.length) throw new Error('Writing sets are missing');

                    problemSet.innerHTML = '<option value="">문제를 선택하세요</option>';
                    sets.forEach(set => {
                        const option = document.createElement('option');
                        option.value = set;
                        option.textContent = set;
                        problemSet.appendChild(option);
                    });
                    problemSet.disabled = false;
                    findButton.disabled = false;
                })
                .catch(() => {
                    problemSet.innerHTML = '<option value="">문제를 불러오지 못했습니다.</option>';
                    status.innerText = '작문 문제를 불러오지 못했습니다. 잠시 후 다시 시도하세요.';
                });
        }

        function findResult(event) {
            event.preventDefault();

            const studentName = document.getElementById('student-name').value.trim();
            const problemSet = document.getElementById('problem-set').value;
            const password = document.getElementById('password').value;
            const findButton = document.getElementById('find-btn');
            const status = document.getElementById('status');

            if (!studentName || !problemSet || !password) {
                status.innerText = '이름, 문제, 암호를 모두 입력하세요.';
                return;
            }

            findButton.disabled = true;
            status.innerText = '결과를 찾는 중입니다...';
            status.style.color = '#3182ce';

            const formData = new URLSearchParams({
                action: 'findWritingSubmission',
                studentName: studentName,
                problemSet: problemSet,
                password: password
            });

            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(data => {
                if (!data || !data.found || !data.submissionId) {
                    throw new Error('Writing submission not found');
                }
                location.href = `writing-result.html?id=${encodeURIComponent(data.submissionId)}`;
            })
            .catch(() => {
                findButton.disabled = false;
                status.innerText = '일치하는 작문 결과를 찾지 못했습니다. 이름, 문제, 암호를 확인하세요.';
                status.style.color = '#c53030';
            });
        }
    </script>
</body>
</html>
