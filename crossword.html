<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>크로스퍼즐 | 대성 SKY</title>
    <style>
        :root {
            --ink: #26313d;
            --muted: #647181;
            --line: #dbe2e8;
            --page: #f4f6f8;
            --teal: #197c79;
            --teal-dark: #126460;
            --blue: #2d6fb7;
            --blue-soft: #edf5ff;
            --green: #247253;
            --green-soft: #eef8f2;
            --coral: #b44949;
            --coral-soft: #fff1f1;
            --orange: #a65d10;
            --amber: #a56416;
            --amber-soft: #fff8e9;
        }

        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink); font-family: "Malgun Gothic", Arial, sans-serif; }
        button, input { font: inherit; }
        button { cursor: pointer; }
        .page { width: min(860px, calc(100% - 32px)); min-height: calc(100vh - 48px); margin: 24px auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .brand h1 { margin: 0; color: var(--teal-dark); font-size: 23px; letter-spacing: 0; }
        .brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
        .home-btn, .back-btn, .check-btn, .reset-btn, .puzzle-btn { border-radius: 6px; font-weight: 700; }
        .home-btn { flex: 0 0 auto; border: 1px solid #d7a45d; background: #fff; color: var(--orange); padding: 7px 10px; font-size: 13px; }
        .home-btn:hover { background: #fff5e7; }
        main { padding: 28px 22px 34px; }
        h2 { margin: 0; color: var(--ink); font-size: 21px; }
        .hidden { display: none !important; }
        .name-entry { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; max-width: 360px; margin-top: 16px; }
        .name-entry label { color: var(--ink); font-size: 14px; font-weight: 700; }
        .name-entry input { width: 100%; border: 1px solid #bcc8d3; border-radius: 6px; color: var(--ink); padding: 11px 12px; font-size: 16px; outline: none; }
        .name-entry input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(45, 111, 183, 0.13); }
        .menu-status { min-height: 20px; margin: 8px 0 0; color: var(--coral); font-size: 13px; font-weight: 700; }

        .puzzle-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
        .puzzle-btn { min-height: 82px; border: 1px solid #b9d2e9; background: var(--blue-soft); color: var(--ink); padding: 16px; text-align: center; }
        .puzzle-btn:hover { border-color: var(--blue); background: #e2f0ff; }
        .puzzle-number { display: block; color: var(--blue); font-size: 23px; font-weight: 800; }
        .puzzle-title { display: block; margin-top: 11px; font-size: 15px; }
        .puzzle-count { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
        .ranking-menu-btn { display: block; width: 100%; margin-top: 14px; border: 1px solid #b8d9c6; border-radius: 6px; background: var(--green-soft); color: var(--green); padding: 11px 14px; font-weight: 700; }
        .ranking-menu-btn:hover { background: #e1f2e8; }

        .puzzle-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
        .puzzle-title-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
        .puzzle-title-row h2 { overflow-wrap: anywhere; }
        .puzzle-meta { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
        .timer { color: var(--teal-dark); font-size: 17px; font-weight: 800; }
        .back-btn { flex: 0 0 auto; border: 1px solid #c6d1dc; background: #fff; color: #526273; padding: 7px 10px; font-size: 13px; }
        .back-btn:hover { background: #f2f5f8; }
        .grid-scroll { overflow-x: auto; padding: 3px 1px 14px; }
        .crossword-grid { --cell-size: 35px; display: grid; gap: 0; width: max-content; margin: 0 auto; }
        .grid-cell { position: relative; width: var(--cell-size); height: var(--cell-size); border: 1px solid #26313d; background: #fff; }
        .grid-cell.blank { border-color: transparent; background: transparent; }
        .grid-cell input { width: 100%; height: 100%; border: 0; border-radius: 0; background: transparent; color: var(--ink); outline: none; padding: 8px 1px 0; text-align: center; text-transform: uppercase; font-size: 18px; font-weight: 800; }
        .grid-cell input:focus { background: #e5f2ff; box-shadow: inset 0 0 0 2px var(--blue); }
        .grid-cell input.correct { background: var(--green-soft); color: var(--green); }
        .grid-cell input.wrong { background: var(--coral-soft); color: var(--coral); }
        .grid-cell input.hinted { background: var(--amber-soft); color: var(--amber); }
        .cell-number { position: absolute; z-index: 1; top: 2px; left: 3px; color: var(--muted); font-size: 8px; font-weight: 700; pointer-events: none; }
        .action-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 2px 0 18px; }
        .check-btn { border: 0; background: var(--teal); color: #fff; padding: 10px 16px; }
        .check-btn:hover { background: var(--teal-dark); }
        .hint-btn { border: 1px solid #e1bc7a; border-radius: 6px; background: #fff; color: var(--amber); padding: 9px 13px; font-weight: 700; }
        .hint-btn:hover:not(:disabled) { background: var(--amber-soft); }
        .hint-btn:disabled { cursor: default; opacity: .48; }
        .reset-btn { border: 1px solid #c6d1dc; background: #fff; color: #526273; padding: 9px 14px; }
        .reset-btn:hover { background: #f2f5f8; }
        .status { min-height: 20px; margin: 0 0 14px; color: var(--muted); font-size: 14px; font-weight: 700; text-align: center; }
        .status.success { color: var(--green); }
        .status.error { color: var(--coral); }
        .completed-words { margin: 0 0 18px; border-top: 1px solid var(--line); padding-top: 16px; }
        .completed-words h3 { margin: 0 0 8px; color: var(--ink); font-size: 16px; }
        .completed-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; margin: 0; padding: 0; list-style: none; }
        .completed-list li { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: baseline; gap: 6px; min-width: 0; border-bottom: 1px solid #eaf0f4; padding: 8px 2px; color: var(--muted); font-size: 13px; }
        .completed-number { color: var(--green); font-weight: 800; }
        .completed-answer { color: var(--ink); font-weight: 800; }
        .completed-meaning { overflow-wrap: anywhere; }
        .clues { border-top: 1px solid var(--line); padding-top: 18px; }
        .clues h3 { margin: 0 0 10px; color: var(--ink); font-size: 16px; }
        .clue-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        .clue-group h4 { margin: 0 0 8px; color: var(--teal-dark); font-size: 14px; }
        .clue-list { margin: 0; padding: 0; list-style: none; }
        .clue-list li { border-bottom: 1px solid #eaf0f4; }
        .clue-btn { width: 100%; border: 0; background: transparent; color: var(--ink); padding: 10px 3px; text-align: left; line-height: 1.45; font-size: 13px; }
        .clue-btn:hover, .clue-btn.selected { background: #f0f7fc; }
        .clue-btn.selected { box-shadow: inset 3px 0 0 var(--blue); }
        .clue-num { color: var(--blue); font-weight: 800; }
        .ranking { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 18px; }
        .ranking-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        .ranking-header h3 { margin: 0; color: var(--ink); font-size: 16px; }
        .ranking-header span { color: var(--muted); font-size: 12px; }
        .ranking-list { margin: 10px 0 0; padding: 0; list-style: none; border-top: 1px solid #eaf0f4; }
        .ranking-list li { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 39px; padding: 7px 2px; border-bottom: 1px solid #eaf0f4; }
        .ranking-rank { color: var(--teal-dark); font-size: 13px; font-weight: 800; }
        .ranking-name { color: var(--ink); font-size: 14px; font-weight: 700; }
        .ranking-time { color: var(--muted); font-size: 13px; }
        .ranking-empty { display: block !important; padding: 15px 0 !important; color: var(--muted); font-size: 13px; text-align: center; }
        .ranking-view-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .ranking-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
        .ranking-tab { border: 1px solid #c6d1dc; border-radius: 6px; background: #fff; color: #526273; padding: 9px 10px; font-weight: 700; }
        .ranking-tab:hover, .ranking-tab.active { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
        .ranking-view .ranking { margin-top: 16px; }

        @media (max-width: 560px) {
            .page { width: 100%; min-height: 100vh; margin: 0; border: 0; border-radius: 0; }
            .topbar { padding: 14px 16px; }
            main { padding: 24px 16px; }
            .puzzle-list { grid-template-columns: 1fr; }
            .puzzle-btn { min-height: 76px; }
            .crossword-grid { --cell-size: 30px; }
            .grid-cell input { padding-top: 7px; font-size: 16px; }
            .clue-groups { grid-template-columns: 1fr; gap: 16px; }
            .completed-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

        <header class="topbar">
            <div class="brand">
                <h1>CROSSWORD</h1>

                        <span>이니셜 표시</span>
                    </div>
                    <ol id="ranking-list" class="ranking-list"></ol>
                </section>
            </section>

            <section id="puzzle-view" class="hidden" aria-live="polite">
                <div class="puzzle-top">
                    <div class="puzzle-title-row">
                        <h2 id="puzzle-heading"></h2>
                        <div class="puzzle-meta">

                    <button id="back-btn" class="back-btn" type="button">목록</button>
                </div>

                <div class="grid-scroll">
                    <div id="crossword-grid" class="crossword-grid" aria-label="크로스퍼즐 입력판"></div>
                </div>

                <div class="action-row">
                    <button id="check-btn" class="check-btn" type="button">정답 확인</button>
                    <button id="hint-btn" class="hint-btn" type="button">힌트 5회</button>
                    <button id="reset-btn" class="reset-btn" type="button">다시 풀기</button>
                </div>
                <p id="status" class="status" role="status"></p>

                <section id="completed-words" class="completed-words hidden" aria-live="polite">
                    <h3>맞힌 단어</h3>
                    <ul id="completed-list" class="completed-list"></ul>
                </section>

                <section class="clues" aria-label="영어 단어 설명">
                    <h3>English Clues</h3>
                    <div class="clue-groups">
                        <div>
                            <h4>Across</h4>

                        <div>
                            <h4>Down</h4>
                            <ul id="down-list" class="clue-list"></ul>
                        </div>
                    </div>
                </section>

            </section>
        </main>
    </div>

    <script>

                ],

                    { answer: 'survey', direction: 'across', x: -4, y: 3 },

                    { answer: 'status', direction: 'down', x: -4, y: 3 },

            },

                words: [

                    { answer: 'regard', clue: 'To think of someone or something in a particular way.', meaning: '여기다, 고려하다' },
                    { answer: 'pursue', clue: 'To continue doing or trying to achieve something.', meaning: '추구하다' },

                ],

                    { answer: 'retain', direction: 'across', x: 0, y: 3 },
                    { answer: 'source', direction: 'down', x: 0, y: 0 }
                ]
            }
        ];

        const elements = {
            menuView: document.getElementById('menu-view'),
            rankingView: document.getElementById('ranking-view'),
            puzzleView: document.getElementById('puzzle-view'),
            puzzleList: document.getElementById('puzzle-list'),
            showRankingsBtn: document.getElementById('show-rankings-btn'),
            rankingBackBtn: document.getElementById('ranking-back-btn'),
            rankingTabs: document.getElementById('ranking-tabs'),
            rankingHeading: document.getElementById('ranking-heading'),
            studentName: document.getElementById('student-name'),
            menuStatus: document.getElementById('menu-status'),
            puzzleHeading: document.getElementById('puzzle-heading'),
            puzzleProgress: document.getElementById('puzzle-progress'),
            timer: document.getElementById('timer'),
            grid: document.getElementById('crossword-grid'),
            acrossList: document.getElementById('across-list'),
            downList: document.getElementById('down-list'),
            status: document.getElementById('status'),
            checkBtn: document.getElementById('check-btn'),
            hintBtn: document.getElementById('hint-btn'),
            resetBtn: document.getElementById('reset-btn'),
            backBtn: document.getElementById('back-btn'),
            rankingList: document.getElementById('ranking-list'),
            completedWords: document.getElementById('completed-words'),
            completedList: document.getElementById('completed-list')
        };

        let activePuzzle = null;
        let activeLayout = null;
        let playerName = localStorage.getItem('crosswordPlayerName') || '';
        let startedAt = 0;
        let timerId = null;
        let completed = false;
        let rankingPuzzleId = '1';
        let hintsRemaining = 5;
        let selectedWord = null;

        function cellKey(x, y) {
            return `${x},${y}`;
        }

        function wordCoordinate(word, index) {
            return {
                x: word.x + (word.direction === 'across' ? index : 0),
                y: word.y + (word.direction === 'down' ? index : 0)
            };
        }

        function buildLayout(sourceWords, fixedLayout = null) {
            const cells = new Map();
            const placed = [];
            const addWord = placement => {
                placed.push(placement);
                [...placement.answer].forEach((letter, index) => {
                    const point = wordCoordinate(placement, index);
                    const key = cellKey(point.x, point.y);
                    if (!cells.has(key)) cells.set(key, { letter, x: point.x, y: point.y });
                });
            };

            if (fixedLayout) {
                const wordsByAnswer = new Map(sourceWords.map(word => [word.answer, word]));
                fixedLayout.forEach(placement => {
                    const word = wordsByAnswer.get(placement.answer);
                    if (!word) return;
                    addWord({ ...word, ...placement });
                });
                return finalizeLayout(cells, placed);
            }

            addWord({ ...sourceWords[0], direction: 'across', x: 0, y: 0 });
            const remaining = sourceWords.slice(1).map(word => ({ ...word }));

            while (remaining.length) {
                const choices = remaining.map((word, index) => ({
                    index,
                    word,
                    candidates: getCandidates(word, placed, cells)
                })).filter(choice => choice.candidates.length);

                if (!choices.length) break;
                choices.sort((a, b) => a.candidates.length - b.candidates.length);
                const choice = choices[0];
                choice.candidates.sort((a, b) => a.area - b.area || b.intersections - a.intersections);
                addWord(choice.candidates[0]);
                remaining.splice(choice.index, 1);
            }

            return finalizeLayout(cells, placed);
        }

        function finalizeLayout(cells, placed) {
            const bounds = getBounds(cells);
            const starts = new Map();
            [...placed].sort((a, b) => a.y - b.y || a.x - b.x).forEach(word => {
                const key = cellKey(word.x, word.y);
                if (!starts.has(key)) starts.set(key, starts.size + 1);
                word.number = starts.get(key);
            });
            return { cells, placed, bounds };
        }

        function getCandidates(word, placed, cells) {
            const candidates = [];
            const seen = new Set();

            placed.forEach(existing => {
                const direction = existing.direction === 'across' ? 'down' : 'across';
                [...word.answer].forEach((letter, wordIndex) => {
                    [...existing.answer].forEach((existingLetter, existingIndex) => {
                        if (letter !== existingLetter) return;
                        const intersection = wordCoordinate(existing, existingIndex);
                        const x = intersection.x - (direction === 'across' ? wordIndex : 0);
                        const y = intersection.y - (direction === 'down' ? wordIndex : 0);
                        const placement = { ...word, direction, x, y };
                        const key = `${direction}:${x}:${y}`;
                        if (seen.has(key) || !isValidPlacement(placement, cells)) return;
                        seen.add(key);
                        const intersections = countIntersections(placement, cells);
                        candidates.push({ ...placement, intersections, area: getCandidateArea(placement, cells) });
                    });
                });
            });
            return candidates;
        }

        function isValidPlacement(word, cells) {
            const dx = word.direction === 'across' ? 1 : 0;
            const dy = word.direction === 'down' ? 1 : 0;
            if (cells.has(cellKey(word.x - dx, word.y - dy))) return false;
            const after = wordCoordinate(word, word.answer.length - 1);
            if (cells.has(cellKey(after.x + dx, after.y + dy))) return false;

            let intersections = 0;
            for (let index = 0; index < word.answer.length; index++) {
                const point = wordCoordinate(word, index);
                const existing = cells.get(cellKey(point.x, point.y));
                if (existing) {
                    if (existing.letter !== word.answer[index]) return false;
                    intersections++;
                    continue;
                }
                const sideA = word.direction === 'across' ? cellKey(point.x, point.y - 1) : cellKey(point.x - 1, point.y);
                const sideB = word.direction === 'across' ? cellKey(point.x, point.y + 1) : cellKey(point.x + 1, point.y);
                if (cells.has(sideA) || cells.has(sideB)) return false;
            }
            return intersections > 0;
        }

        function countIntersections(word, cells) {
            return [...word.answer].reduce((count, _, index) => {
                const point = wordCoordinate(word, index);
                return count + (cells.has(cellKey(point.x, point.y)) ? 1 : 0);
            }, 0);
        }

        function getBounds(cells) {
            const points = [...cells.values()];
            return {
                minX: Math.min(...points.map(point => point.x)),
                maxX: Math.max(...points.map(point => point.x)),
                minY: Math.min(...points.map(point => point.y)),
                maxY: Math.max(...points.map(point => point.y))
            };
        }

        function getCandidateArea(word, cells) {
            const projected = new Map(cells);
            [...word.answer].forEach((letter, index) => {
                const point = wordCoordinate(word, index);
                projected.set(cellKey(point.x, point.y), { letter, x: point.x, y: point.y });
            });
            const bounds = getBounds(projected);
            return (bounds.maxX - bounds.minX + 1) * (bounds.maxY - bounds.minY + 1);
        }

        function renderMenu() {
            elements.puzzleList.replaceChildren();
            PUZZLES.forEach((puzzle, index) => {
                const button = document.createElement('button');
                const number = document.createElement('span');
                button.className = 'puzzle-btn';
                button.type = 'button';
                number.className = 'puzzle-number';
                number.textContent = `${index + 1}번`;
                button.append(number);
                button.addEventListener('click', () => openPuzzle(puzzle.id));
                elements.puzzleList.appendChild(button);
            });
        }

        function openPuzzle(id) {
            playerName = elements.studentName.value.trim();
            if (!playerName) {
                elements.menuStatus.textContent = '이름을 입력한 뒤 퍼즐을 골라 주세요.';
                elements.studentName.focus();
                return;
            }
            localStorage.setItem('crosswordPlayerName', playerName);
            activePuzzle = PUZZLES.find(puzzle => puzzle.id === id);
            if (!activePuzzle) return;
            activeLayout = buildLayout(activePuzzle.words, activePuzzle.layout);
            completed = false;
            hintsRemaining = 5;
            selectedWord = null;
            elements.menuView.classList.add('hidden');
            elements.puzzleView.classList.remove('hidden');
            elements.puzzleHeading.textContent = activePuzzle.title;
            setStatus('');
            renderPuzzle();
            updateHintButton();
            startTimer();
            history.replaceState(null, '', `crossword.html?game=${encodeURIComponent(id)}`);
        }

        function renderPuzzle() {
            const { cells, placed, bounds } = activeLayout;
            const startNumbers = new Map(placed.map(word => [cellKey(word.x, word.y), word.number]));
            elements.grid.replaceChildren();
            elements.completedList.replaceChildren();
            elements.completedWords.classList.add('hidden');
            selectedWord = null;
            elements.grid.style.gridTemplateColumns = `repeat(${bounds.maxX - bounds.minX + 1}, var(--cell-size))`;

            for (let y = bounds.minY; y <= bounds.maxY; y++) {
                for (let x = bounds.minX; x <= bounds.maxX; x++) {
                    const cell = cells.get(cellKey(x, y));
                    const box = document.createElement('div');
                    box.className = 'grid-cell';
                    if (!cell) {
                        box.classList.add('blank');
                        elements.grid.appendChild(box);
                        continue;
                    }
                    const number = startNumbers.get(cellKey(x, y));
                    if (number) {
                        const label = document.createElement('span');
                        label.className = 'cell-number';
                        label.textContent = String(number);
                        box.appendChild(label);
                    }
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.inputMode = 'text';
                    input.autocomplete = 'off';
                    input.autocapitalize = 'characters';
                    input.spellcheck = false;
                    input.dataset.key = cellKey(x, y);
                    input.addEventListener('input', handleCellInput);
                    input.addEventListener('keydown', handleCellKeydown);
                    input.addEventListener('focus', () => selectWordAtCell(input.dataset.key));
                    box.appendChild(input);
                    elements.grid.appendChild(box);
                }
            }

            renderClues(placed);
            updateProgress();
        }

        function renderClues(placed) {
            elements.acrossList.replaceChildren();
            elements.downList.replaceChildren();
            ['across', 'down'].forEach(direction => {
                const list = direction === 'across' ? elements.acrossList : elements.downList;
                placed.filter(word => word.direction === direction).sort((a, b) => a.number - b.number).forEach(word => {
                    const item = document.createElement('li');
                    const button = document.createElement('button');
                    const number = document.createElement('span');
                    button.className = 'clue-btn';
                    button.type = 'button';
                    button.dataset.wordKey = wordKey(word);
                    number.className = 'clue-num';
                    number.textContent = `${word.number}.`;
                    button.append(number, document.createTextNode(` ${word.clue}`));
                    button.addEventListener('click', () => selectWord(word));
                    item.appendChild(button);
                    list.appendChild(item);
                });
            });
        }

        function focusWord(word) {
            const first = wordCoordinate(word, 0);
            const input = elements.grid.querySelector(`input[data-key="${cellKey(first.x, first.y)}"]`);
            if (input) input.focus();
        }

        function wordKey(word) {
            return `${word.direction}-${word.number}`;
        }

        function selectWord(word) {
            selectedWord = word;
            updateSelectedClue();
            focusWord(word);
        }

        function selectWordAtCell(key) {
            if (!activeLayout) return;
            const matches = activeLayout.placed.filter(word => [...word.answer].some((_, index) => {
                const point = wordCoordinate(word, index);
                return cellKey(point.x, point.y) === key;
            }));
            if (!matches.length || matches.includes(selectedWord)) return;
            selectedWord = matches.find(word => word.direction === 'across') || matches[0];
            updateSelectedClue();
        }

        function updateSelectedClue() {
            elements.puzzleView.querySelectorAll('[data-word-key]').forEach(button => {
                button.classList.toggle('selected', selectedWord && button.dataset.wordKey === wordKey(selectedWord));
            });
        }

        function handleCellInput(event) {
            const input = event.currentTarget;
            input.value = input.value.replace(/[^a-z]/gi, '').slice(-1).toUpperCase();
            input.classList.remove('correct', 'wrong', 'hinted');
            updateProgress();
            updateCompletedWords();
        }

        function handleCellKeydown(event) {
            if (event.key !== 'Backspace' || event.currentTarget.value) return;
            const inputs = [...elements.grid.querySelectorAll('input')];
            const previous = inputs[inputs.indexOf(event.currentTarget) - 1];
            if (previous) previous.focus();
        }

        function updateProgress() {
            const inputs = [...elements.grid.querySelectorAll('input')];
            const filled = inputs.filter(input => input.value).length;
            elements.puzzleProgress.textContent = `${filled} / ${inputs.length}`;
        }

        function isWordComplete(word) {
            return [...word.answer].every((letter, index) => {
                const point = wordCoordinate(word, index);
                const input = elements.grid.querySelector(`input[data-key="${cellKey(point.x, point.y)}"]`);
                return input && input.value === letter.toUpperCase();
            });
        }

        function updateCompletedWords() {
            if (!activeLayout) return;
            const completedWords = activeLayout.placed
                .filter(isWordComplete)
                .sort((a, b) => a.number - b.number || a.direction.localeCompare(b.direction));

            elements.completedList.replaceChildren();
            elements.completedWords.classList.toggle('hidden', completedWords.length === 0);
            completedWords.forEach(word => {
                const item = document.createElement('li');
                const number = document.createElement('span');
                const answer = document.createElement('span');
                const meaning = document.createElement('span');
                number.className = 'completed-number';
                answer.className = 'completed-answer';
                meaning.className = 'completed-meaning';
                number.textContent = `${word.number}.`;
                answer.textContent = word.answer;
                meaning.textContent = word.meaning;
                item.append(number, answer, meaning);
                elements.completedList.appendChild(item);
            });
        }

        function updateHintButton() {
            elements.hintBtn.textContent = `힌트 ${hintsRemaining}회`;
            elements.hintBtn.disabled = completed || hintsRemaining === 0;
        }

        function useHint() {
            if (completed || hintsRemaining === 0) return;
            if (!selectedWord) {
                setStatus('힌트가 필요한 단어 설명이나 칸을 먼저 눌러 주세요.');
                return;
            }
            if (isWordComplete(selectedWord)) {
                setStatus('이 단어는 이미 맞혔습니다. 다른 단어를 골라 주세요.');
                return;
            }
            [...selectedWord.answer].forEach((letter, index) => {
                const point = wordCoordinate(selectedWord, index);
                const input = elements.grid.querySelector(`input[data-key="${cellKey(point.x, point.y)}"]`);
                if (!input) return;
                input.value = letter.toUpperCase();
                input.classList.remove('correct', 'wrong');
                input.classList.add('hinted');
            });
            hintsRemaining--;
            updateProgress();
            updateCompletedWords();
            updateHintButton();
            setStatus(`${selectedWord.number}번 정답을 알려드렸습니다. ${hintsRemaining}회 남았습니다.`);
        }

        function startTimer() {
            stopTimer();
            startedAt = Date.now();
            updateTimer();
            timerId = window.setInterval(updateTimer, 250);
        }

        function stopTimer() {
            if (timerId) window.clearInterval(timerId);
            timerId = null;
        }

        function updateTimer() {
            const seconds = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
            elements.timer.textContent = formatTime(seconds);
        }

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        }

        function checkAnswers() {
            let wrong = 0;
            let empty = 0;
            elements.grid.querySelectorAll('input').forEach(input => {
                const expected = activeLayout.cells.get(input.dataset.key).letter.toUpperCase();
                input.classList.remove('correct', 'wrong');
                if (!input.value) {
                    empty++;
                    return;
                }
                input.classList.add(input.value === expected ? 'correct' : 'wrong');
                if (input.value !== expected) wrong++;
            });
            if (empty) {
                setStatus(`빈 칸이 ${empty}개 있습니다. 모두 채운 뒤 확인해 주세요.`, 'error');
                return;
            }
            if (wrong) {
                setStatus(`${wrong}칸을 다시 확인해 주세요.`, 'error');
                return;
            }
            updateCompletedWords();
            finishPuzzle();
        }

        async function finishPuzzle() {
            if (completed) return;
            completed = true;
            stopTimer();
            const elapsedSeconds = Math.max(1, Math.ceil((Date.now() - startedAt) / 1000));
            elements.timer.textContent = formatTime(elapsedSeconds);
            updateHintButton();
            if (hintsRemaining < 5) {
                setStatus(`정답입니다. 힌트를 사용했으므로 순위에는 기록하지 않습니다.`, 'success');
                return;
            }
            setStatus(`정답입니다. ${elapsedSeconds}초 기록을 저장 중입니다.`, 'success');

            try {
                const body = new URLSearchParams({
                    action: 'saveCrosswordResult',
                    studentName: playerName,
                    puzzleId: activePuzzle.id,
                    elapsedSeconds: String(elapsedSeconds)
                });
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body.toString()
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!data || !data.ok) throw new Error('save failed');
                setStatus(`정답입니다. ${elapsedSeconds}초 기록이 저장됐습니다.`, 'success');
            } catch (error) {
                setStatus(`정답입니다. ${elapsedSeconds}초입니다. 기록 저장은 잠시 후 다시 시도해 주세요.`, 'success');
            }
        }

        function showRankings() {
            stopTimer();
            elements.menuView.classList.add('hidden');
            elements.puzzleView.classList.add('hidden');
            elements.rankingView.classList.remove('hidden');
            renderRankingTabs();
            loadRanking(rankingPuzzleId);
            history.replaceState(null, '', 'crossword.html?rankings=true');
        }

        function renderRankingTabs() {
            elements.rankingTabs.replaceChildren();
            PUZZLES.forEach(puzzle => {
                const button = document.createElement('button');
                button.className = `ranking-tab${puzzle.id === rankingPuzzleId ? ' active' : ''}`;
                button.type = 'button';
                button.textContent = puzzle.title;
                button.addEventListener('click', () => {
                    rankingPuzzleId = puzzle.id;
                    renderRankingTabs();
                    loadRanking(rankingPuzzleId);
                });
                elements.rankingTabs.appendChild(button);
            });
            elements.rankingHeading.textContent = `${rankingPuzzleId}번 빠른 기록 TOP 10`;
        }

        async function loadRanking(puzzleId) {
            renderRanking([]);
            try {
                const response = await fetch(`${scriptURL}?action=getCrosswordLeaderboard&puzzleId=${encodeURIComponent(puzzleId)}&t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data && data.ok) renderRanking(data.leaderboard || []);
            } catch (error) {
                renderRanking([]);
            }
        }

        function renderRanking(entries) {
            elements.rankingList.replaceChildren();
            if (!entries.length) {
                const empty = document.createElement('li');
                empty.className = 'ranking-empty';
                empty.textContent = '아직 기록이 없습니다.';
                elements.rankingList.appendChild(empty);
                return;
            }
            entries.forEach(entry => {
                const item = document.createElement('li');
                const rank = document.createElement('span');
                const name = document.createElement('span');
                const time = document.createElement('span');
                rank.className = 'ranking-rank';
                name.className = 'ranking-name';
                time.className = 'ranking-time';
                rank.textContent = `${entry.rank}위`;
                name.textContent = entry.studentName || '**';
                time.textContent = `${entry.elapsedSeconds}초`;
                item.append(rank, name, time);
                elements.rankingList.appendChild(item);
            });
        }

        function resetPuzzle() {
            elements.grid.querySelectorAll('input').forEach(input => {
                input.value = '';
                input.classList.remove('correct', 'wrong', 'hinted');
            });
            updateHintButton();
            updateProgress();
            updateCompletedWords();
            setStatus('');
            const first = elements.grid.querySelector('input');
            if (first) first.focus();
        }

        function setStatus(message, type = '') {
            elements.status.textContent = message;
            elements.status.className = `status${type ? ` ${type}` : ''}`;
        }

        elements.checkBtn.addEventListener('click', checkAnswers);
        elements.hintBtn.addEventListener('click', useHint);
        elements.resetBtn.addEventListener('click', resetPuzzle);
        elements.backBtn.addEventListener('click', () => {
            stopTimer();
            elements.puzzleView.classList.add('hidden');
            elements.menuView.classList.remove('hidden');
            history.replaceState(null, '', 'crossword.html');
        });

        elements.showRankingsBtn.addEventListener('click', showRankings);
        elements.rankingBackBtn.addEventListener('click', () => {
            elements.rankingView.classList.add('hidden');
            elements.menuView.classList.remove('hidden');
            history.replaceState(null, '', 'crossword.html');
        });

        elements.studentName.value = playerName;
        elements.studentName.addEventListener('input', () => {
            elements.menuStatus.textContent = '';
        });
        renderMenu();
        const requestedId = new URLSearchParams(location.search).get('game');
        if (requestedId) openPuzzle(requestedId);
        if (new URLSearchParams(location.search).get('rankings') === 'true') showRankings();
    </script>
</body>
